[package]
name = "macro-bridge-configurator"
version = "0.1.0"
description = "Local GUI for the Premiere Macro Bridge config"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "macro_bridge_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
